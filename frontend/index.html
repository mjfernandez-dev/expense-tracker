<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanzaApp – Gestión de finanzas personales</title>
    <meta name="description" content="Gestioná tus gastos e ingresos personales y compartidos con FinanzaApp." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts: JetBrains Mono (monospace for numbers) + Inter (clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect al API (actualizar URL en producción) -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
  </head>
  <body style="background-color: #0f172a; margin: 0;">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root"></div>
    <script>
      // PWA cache-busting: recarga automática si cambian los hashes de los bundles
      (function() {
        if (!('caches' in window)) return;
        var cur = [];
        document.querySelectorAll('link[rel="stylesheet"],script[type="module"]').forEach(function(el) {
          var u = el.getAttribute('href') || el.getAttribute('src');
          if (u) cur.push(u);
        });
        if (cur.length === 0) return;
        fetch('/index.html', { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(html) {
          var nu = [], re = /(?:href|src)="(\/[^"]+\.(?:css|js))"/g, m;
          while ((m = re.exec(html)) !== null) nu.push(m[1]);
          if (cur.length !== nu.length) return clearAll();
          for (var i = 0; i < cur.length; i++) { if (cur[i] !== nu[i]) return clearAll(); }
          function clearAll() {
            caches.keys().then(function(k) { return Promise.all(k.map(function(n) { return caches.delete(n); })); }).then(function() { location.reload(); });
          }
        }).catch(function() {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
