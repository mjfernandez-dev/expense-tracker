<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanzaApp – Gestión de finanzas personales</title>
    <meta name="description" content="Gestioná tus gastos e ingresos personales y compartidos con FinanzaApp." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts: JetBrains Mono (monospace for numbers) + Inter (clean body) -->
    <!-- no render-blocking: preload + media="print" + onload swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect al API (actualizar URL en producción) -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />

    <!-- App Shell: visible antes de que React cargue (reduce el LCP percibido) -->
    <style>
      .ashell {
        min-height: 100vh;
        background: linear-gradient(to bottom right, #020617, #0f172a, #1e3a5f);
        display: flex;
        flex-direction: column;
      }
      .ash-hdr {
        background: rgba(30,41,59,0.8);
        backdrop-filter: blur(24px);
        border-bottom: 1px solid rgba(71,85,105,0.7);
      }
      .ash-hdr-in {
        max-width: 72rem; margin: 0 auto;
        padding: 0.75rem 1rem;
        display: flex; justify-content: space-between; align-items: center;
      }
      .ash-hdr-l {
        display: flex; flex-direction: column; gap: 2px;
      }
      .ash-ttl {
        width: 120px; height: 20px;
        background: rgba(148,163,184,0.15); border-radius: 6px;
        animation: ash-pulse 2s ease-in-out infinite;
      }
      .ash-sub {
        width: 80px; height: 10px;
        background: rgba(148,163,184,0.1); border-radius: 4px;
        animation: ash-pulse 2s ease-in-out infinite;
      }
      .ash-hdr-r {
        width: 70px; height: 28px;
        background: rgba(71,85,105,0.3); border-radius: 8px;
        animation: ash-pulse 2s ease-in-out infinite;
      }
      .ash-body {
        flex: 1; max-width: 72rem; margin: 0 auto; padding: 1rem;
        width: 100%; box-sizing: border-box;
      }
      .ash-card {
        background: rgba(51,65,85,0.3); border: 1px solid rgba(71,85,105,0.4);
        border-radius: 16px; padding: 1rem;
        animation: ash-pulse 2s ease-in-out infinite;
        height: 180px;
      }
      .ash-tabs {
        background: rgba(30,41,59,0.9);
        backdrop-filter: blur(24px);
        border-top: 1px solid rgba(71,85,105,0.7);
        display: flex; justify-content: center; gap: 1rem;
        padding: 0.75rem 1rem;
      }
      .ash-tab {
        width: 48px; height: 36px;
        background: rgba(71,85,105,0.25); border-radius: 8px;
        animation: ash-pulse 2s ease-in-out infinite;
      }
      @keyframes ash-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
    </style>
  </head>
  <body style="background-color: #0f172a; margin: 0;">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root">
      <div class="ashell">
        <div class="ash-hdr">
          <div class="ash-hdr-in">
            <div class="ash-hdr-l">
              <div class="ash-ttl"></div>
              <div class="ash-sub"></div>
            </div>
            <div class="ash-hdr-r"></div>
          </div>
        </div>
        <div class="ash-body">
          <div class="ash-card"></div>
        </div>
        <div class="ash-tabs">
          <div class="ash-tab"></div>
          <div class="ash-tab"></div>
          <div class="ash-tab"></div>
          <div class="ash-tab"></div>
          <div class="ash-tab"></div>
        </div>
      </div>
    </div>
    <!-- Recarga una vez cuando un nuevo service worker toma el control -->
    <script>
      if ('serviceWorker' in navigator) {
        var _r = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (_r) return; _r = true; location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
