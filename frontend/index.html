<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanzaApp – Gestión de finanzas personales</title>
    <meta name="description" content="Gestioná tus gastos e ingresos personales y compartidos con FinanzaApp." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts: JetBrains Mono (monospace for numbers) + Inter (clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect al API (actualizar URL en producción) -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
  </head>
  <body style="background-color: #0f172a; margin: 0;">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root"></div>
    <!-- Recarga una vez cuando un nuevo service worker toma el control -->
    <script>
      if ('serviceWorker' in navigator) {
        var _r = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (_r) return; _r = true; location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
